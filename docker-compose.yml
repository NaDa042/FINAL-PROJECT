
# Defines both containers (app + database) needed to run this project,
# so instead of separate "docker build" + "docker run" commands for each,
# we start everything together with a single "docker compose up".

services:
    db:
      image: postgres:16
      cpus: "1.0"
      mem_limit: 1g
      command: postgres -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=8MB -c max_wal_size=2GB -c checkpoint_timeout=1800 -c wal_compression=zstd -c synchronous_commit=off -c gin_pending_list_limit=256MB
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: "nada"
        POSTGRES_PASSWORD : "devpassword"
        POSTGRES_DB : "logs_db"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U nada -d logs_db"]
        interval: 5s
        timeout: 5s
        retries: 10
      deploy:
        resources:
          limits:
            cpus: "1.0"
            memory: 1GB
        

    app:
      build: .
      ports: 
        - "8080:8080"
      cpus : "0.5"
      mem_limit : 256m
      environment:
        DATABASE_URL : "postgres://nada:devpassword@db:5432/logs_db"
        RETENTION_DAYS : 30
      depends_on:
        db:
          condition: service_healthy
      
    

